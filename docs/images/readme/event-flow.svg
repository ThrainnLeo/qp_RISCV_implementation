<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="452" viewBox="0 0 1200 452">
<style>.Display{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:800;font-style:normal}.Body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:400;font-style:normal}.Lead{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:400;font-style:normal}.Sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:400;font-style:normal}.SansB{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:700;font-style:normal}.Mono{font-family:'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;font-weight:400;font-style:normal}</style>
<rect x="0.5" y="0.5" width="1199" height="451" rx="12" fill="#f3f5f3" stroke="#d3dcd9"/>
<text x="56.0" y="66.0" class="Display" font-size="31" fill="#11302b">Event flow</text>
<text x="56.0" y="96.0" class="Lead" font-size="17" fill="#4a5f5a">From flipping a switch to a medicine starting to dose.</text>
<line x1="70" y1="178" x2="274.5" y2="178" stroke="#4a5f5a" stroke-width="1.5" stroke-linecap="round"/>
<path d="M269,173.8 L276,178 L269,182.2" fill="none" stroke="#4a5f5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="60" cy="178" r="6" fill="#0b6b65"/>
<text x="56.0" y="156.0" class="Mono" font-size="12" fill="#6c7d78">01</text>
<text x="56.0" y="216.0" class="Display" font-size="20" fill="#11302b">Switch</text>
<text x="56.0" y="240.0" class="Mono" font-size="14" fill="#0b6b65">PA8 / PA7 / PA6</text>
<text x="56.0" y="262.0" class="Sans" font-size="15" fill="#4a5f5a">flipped by the user</text>
<line x1="302" y1="178" x2="506.5" y2="178" stroke="#4a5f5a" stroke-width="1.5" stroke-linecap="round"/>
<path d="M501,173.8 L508,178 L501,182.2" fill="none" stroke="#4a5f5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="292" cy="178" r="6" fill="#0b6b65"/>
<text x="288.0" y="156.0" class="Mono" font-size="12" fill="#6c7d78">02</text>
<text x="288.0" y="216.0" class="Display" font-size="20" fill="#11302b">Timer ISR</text>
<text x="288.0" y="240.0" class="Mono" font-size="14" fill="#0b6b65">edge detection</text>
<text x="288.0" y="262.0" class="Sans" font-size="15" fill="#4a5f5a">every 10 ms</text>
<line x1="534" y1="178" x2="738.5" y2="178" stroke="#4a5f5a" stroke-width="1.5" stroke-linecap="round"/>
<path d="M733,173.8 L740,178 L733,182.2" fill="none" stroke="#4a5f5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="524" cy="178" r="6" fill="#0b6b65"/>
<text x="520.0" y="156.0" class="Mono" font-size="12" fill="#6c7d78">03</text>
<text x="520.0" y="216.0" class="Display" font-size="20" fill="#11302b">PumpMgr</text>
<text x="520.0" y="240.0" class="Mono" font-size="14" fill="#0b6b65">routes by medId</text>
<text x="520.0" y="262.0" class="Sans" font-size="15" fill="#4a5f5a">the control system</text>
<line x1="766" y1="178" x2="970.5" y2="178" stroke="#4a5f5a" stroke-width="1.5" stroke-linecap="round"/>
<path d="M965,173.8 L972,178 L965,182.2" fill="none" stroke="#4a5f5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="756" cy="178" r="6" fill="#0b6b65"/>
<text x="752.0" y="156.0" class="Mono" font-size="12" fill="#6c7d78">04</text>
<text x="752.0" y="216.0" class="Display" font-size="20" fill="#11302b">Medicine[id]</text>
<text x="752.0" y="240.0" class="Mono" font-size="14" fill="#0b6b65">off → dosing</text>
<text x="752.0" y="262.0" class="Sans" font-size="15" fill="#4a5f5a">one per channel</text>
<circle cx="988" cy="178" r="6" fill="#0b6b65"/>
<text x="984.0" y="156.0" class="Mono" font-size="12" fill="#6c7d78">05</text>
<text x="984.0" y="216.0" class="Display" font-size="20" fill="#11302b">LED</text>
<text x="984.0" y="240.0" class="Mono" font-size="14" fill="#0b6b65">PB0 / PB1 / PB2</text>
<text x="984.0" y="262.0" class="Sans" font-size="15" fill="#4a5f5a">shows dosing</text>
<path d="M524,278 V346 H712" fill="none" stroke="#bf3329" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<text x="536.0" y="306.0" class="SansB" font-size="12" letter-spacing="1.4" fill="#bf3329">ALARM / RESUME</text>
<text x="536.0" y="326.0" class="Sans" font-size="14" fill="#4a5f5a">published to every Medicine</text>
<path d="M712,346 C742,346 732,320 764,320" fill="none" stroke="#bf3329" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="770" cy="320" r="4.5" fill="#bf3329"/>
<text x="784.0" y="325.0" class="Mono" font-size="13" fill="#11302b">Medicine 0</text>
<path d="M712,346 C742,346 732,346 764,346" fill="none" stroke="#bf3329" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="770" cy="346" r="4.5" fill="#bf3329"/>
<text x="784.0" y="351.0" class="Mono" font-size="13" fill="#11302b">Medicine 1</text>
<path d="M712,346 C742,346 732,372 764,372" fill="none" stroke="#bf3329" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="770" cy="372" r="4.5" fill="#bf3329"/>
<text x="784.0" y="377.0" class="Mono" font-size="13" fill="#11302b">Medicine 2</text>
<text x="944.0" y="342.0" class="Sans" font-size="15" fill="#4a5f5a">Every dose stops at once,</text>
<text x="944.0" y="362.0" class="Sans" font-size="15" fill="#4a5f5a">like a fault sending the pump</text>
<text x="944.0" y="382.0" class="Sans" font-size="15" fill="#4a5f5a">to a safe state.</text>
</svg>
