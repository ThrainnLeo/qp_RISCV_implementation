<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="420" viewBox="0 0 1200 420">
<rect width="1200" height="420" rx="12" fill="#16171b"/>
<text x="60" y="62" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="0.5" fill="#ece7df">The 100 Hz system tick</text>
<text x="60" y="94" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9a9aa4">The machine timer schedules its own next interrupt, every 10 ms.</text>
<line x1="110" y1="268" x2="1110" y2="268" stroke="#6c6c76"/><line x1="110" y1="128" x2="110" y2="268" stroke="#6c6c76"/>
<text x="102" y="138" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6c6c76">count</text>
<text x="1110" y="288" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6c6c76">time</text>
<line x1="110" y1="268" x2="1110" y2="128" stroke="#7086f5" stroke-width="3"/>
<polyline points="110.0,240.0 310.0,240.0 310.0,212.0 510.0,212.0 510.0,184.0 710.0,184.0 710.0,156.0 910.0,156.0 910.0,128.0 1110.0,128.0" fill="none" stroke="#9a9aa4" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="310.0" y1="240.0" x2="310.0" y2="268" stroke="#7086f5" stroke-width="1" opacity="0.5"/>
<circle cx="310.0" cy="240.0" r="6" fill="#7086f5" stroke="#16171b" stroke-width="2"/>
<text x="320.0" y="256.0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ece7df">ISR</text>
<line x1="510.0" y1="212.0" x2="510.0" y2="268" stroke="#7086f5" stroke-width="1" opacity="0.5"/>
<circle cx="510.0" cy="212.0" r="6" fill="#7086f5" stroke="#16171b" stroke-width="2"/>
<text x="520.0" y="228.0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ece7df">ISR</text>
<line x1="710.0" y1="184.0" x2="710.0" y2="268" stroke="#7086f5" stroke-width="1" opacity="0.5"/>
<circle cx="710.0" cy="184.0" r="6" fill="#7086f5" stroke="#16171b" stroke-width="2"/>
<text x="720.0" y="200.0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ece7df">ISR</text>
<line x1="910.0" y1="156.0" x2="910.0" y2="268" stroke="#7086f5" stroke-width="1" opacity="0.5"/>
<circle cx="910.0" cy="156.0" r="6" fill="#7086f5" stroke="#16171b" stroke-width="2"/>
<text x="920.0" y="172.0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ece7df">ISR</text>
<path d="M310.0,296 v-6 M310.0,296 H510.0 M510.0,296 v-6" fill="none" stroke="#7086f5" stroke-width="2"/>
<text x="410.0" y="316" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#ece7df">10 ms = 270 000 cycles</text>
<line x1="140" y1="146" x2="162" y2="146" stroke="#7086f5" stroke-width="3"/>
<text x="170" y="150" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9a9aa4">mtime (64-bit counter)</text>
<line x1="140" y1="166" x2="162" y2="166" stroke="#9a9aa4" stroke-width="2" stroke-dasharray="5 4"/>
<text x="170" y="170" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9a9aa4">mtimecmp (next deadline)</text>
<rect x="60" y="336" width="352" height="62" rx="8" fill="#1e1f24" stroke="#2d2e35" stroke-width="1"/>
<text x="78" y="360" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#7086f5">TIMER_FREQ</text>
<text x="78" y="384" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#ece7df">108 MHz / 4 = 27 MHz</text>
<rect x="424" y="336" width="352" height="62" rx="8" fill="#1e1f24" stroke="#2d2e35" stroke-width="1"/>
<text x="442" y="360" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#7086f5">tick_step</text>
<text x="442" y="384" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#ece7df">27 MHz / 100 = 270 000</text>
<rect x="788" y="336" width="352" height="62" rx="8" fill="#1e1f24" stroke="#2d2e35" stroke-width="1"/>
<text x="806" y="360" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#7086f5">on every ISR</text>
<text x="806" y="384" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#ece7df">mtimecmp = mtime + tick_step</text>
</svg>
