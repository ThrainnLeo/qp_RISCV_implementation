<text x="292.0" y="302.0" class="Mono" font-size="14" fill="#0b6b65">framework + kernel</text>
<text x="856.0" y="302.0" class="Sans" font-size="16" text-anchor="end" fill="#4a5f5a">event queues · publish-subscribe · time events</text>
<line x1="56" y1="326" x2="872" y2="326" stroke="#d3dcd9" stroke-width="1"/>
