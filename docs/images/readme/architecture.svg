<text x="116.0" y="241.0" class="Display" font-size="20" fill="#11302b">Application</text>
<text x="292.0" y="240.0" class="Mono" font-size="14" fill="#0b6b65">pumpMgr.c · medicine.c</text>
<text x="856.0" y="240.0" class="Sans" font-size="16" text-anchor="end" fill="#4a5f5a">MISRA-C, generated by QM</text>
<line x1="56" y1="264" x2="872" y2="264" stroke="#d3dcd9" stroke-width="1"/>
<text x="72.0" y="302.0" class="Mono" font-size="13" fill="#6c7d78">03</text>
