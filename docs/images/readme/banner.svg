<text x="72.0" y="92.0" class="SansB" font-size="12" letter-spacing="1.4" fill="#0b6b65">MEDICAL DEVICE SOFTWARE PLATFORM</text>
<text x="69.0" y="168.0" class="Display" font-size="64" fill="#11302b">QP/C on RISC-V</text>
<text x="72.0" y="214.0" class="Lead" font-size="26" fill="#4a5f5a">Model it. Generate it. Run it.</text>
<text x="72.0" y="270.0" class="Sans" font-size="18" fill="#4a5f5a">Event-driven firmware for medical devices,</text>
<text x="72.0" y="294.0" class="Sans" font-size="18" fill="#4a5f5a">modeled in QM and running bare-metal on a GD32VF103.</text>
<text x="72.0" y="392.0" class="Sans" font-size="14" fill="#6c7d78">Bachelor's thesis · KTH Royal Institute of Technology · 2026</text>
